[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-self-replay"
version = "0.1.2"
description = "Verified self-replay for shorter Qwen3 reasoning, with reproducible experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Martin Matousek"}]
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.26", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
self-replay = "self_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["self_replay", "self_replay.data", "self_replay.methods", "self_replay.evaluation", "self_replay.cloud"]

[tool.setuptools.package-data]
self_replay = ["methods/research/**/*", "methods/overlays/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["vendor", "src/self_replay/methods/research", "src/self_replay/methods/overlays"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
